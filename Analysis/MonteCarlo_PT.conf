# NChains counts independent ladders: here 4 x 6 = 24 replicas.
NChains                    4
ParallelTempering          true
PTTemperatures             1:2:4:8:16:32
PTSwapInterval             10
PTDiagnostics              true
# Optional first patch: bounded adaptation, then discarded fixed-proposal settling.
# PreRunPolicy             staged
# SettlingSweeps           20000
# Optional second patch, independent of PreRunPolicy (default false):
# SmoothAdaptation         true
# Optional temperature optimization; requires staged prerun and positive settling:
# PTAdaptTemperatures      true
# PTAdaptInterval          1000
# PTAdaptRounds            4
# PTAdaptDamping           0.5
# See MonteCarlo/PT_DIAGNOSTICS.md before choosing warmup budgets.
# Optional full proposal cache (works with ordinary MCMC too):
# SaveProposal             fit_proposal.txt
# For reuse, remove staged/smooth/SettlingSweeps/PTAdapt* options, then use:
# LoadProposal             fit_proposal.txt
# ProposalWarmup           20000
PrerunMaxIter              100000
NIterationsUpdateMax       1000
Iterations                 100000
MultivariateProposal       true
MCMCInitialPosition        RandomPrior
RValueForConvergence       1.01
MinimumEfficiency          0.15
MaximumEfficiency          0.5
# PT always saves cold chains, even if WriteChain is false.
WriteChain                 true
WriteLogLikelihoodChain    true
WriteParametersChains      true
FindModeWithMinuit         false
CalculateNormalization     false
PrintAllMarginalized       true
PrintCorrelationMatrix     false
PrintKnowledgeUpdatePlots  false
PrintParameterPlot         false
PrintTrianglePlot          false
