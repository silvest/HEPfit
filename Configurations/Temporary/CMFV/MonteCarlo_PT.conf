# Parallel tempering for the CMFV fit: the sign-flipped solutions of X, Y, C7 (and C9) are separated by
# low-likelihood valleys. Start from Analysis/MonteCarlo_PT.conf and MonteCarlo/PT_DIAGNOSTICS.md.
# NChains = number of independent ladders (4 x 6 temperatures = 24 replicas). Iterations: a pilot value; the
# Delta S - B_Bs - f_Bs direction along the Delta M_s constraint needed ~1e6 iterations in an ordinary run.
NChains                    4
ParallelTempering          true
PTTemperatures             1:2:4:8:16:32
PTSwapInterval             10
PTDiagnostics              true
PrerunMaxIter              100000
NIterationsUpdateMax       1000
Iterations                 100000
MultivariateProposal       true
MCMCInitialPosition        RandomPrior
RValueForConvergence       1.01
MinimumEfficiency          0.15
MaximumEfficiency          0.5
WriteChain                 true
WriteLogLikelihoodChain    true
WriteParametersChains      true
FindModeWithMinuit         false
CalculateNormalization     false
PrintAllMarginalized       true
PrintCorrelationMatrix     false
PrintKnowledgeUpdatePlots  false
PrintParameterPlot         false
PrintTrianglePlot          false
