# CMFV shifts of the master functions: name ave errg errf. Flat priors on [ave - errf, ave + errf].
# setup_cmfv.sh changes the ranges for --smlike and adds the flag for --zdom.
ModelParameter  Ftt         1.     0.   3.
ModelParameter  CMFV_dX    -1.5    0.   4.5
ModelParameter  CMFV_dY    -0.75   0.   2.25
ModelParameter  CMFV_dZ     0.     0.   4.
ModelParameter  CMFV_dC7    0.45   0.   1.05
ModelParameter  CMFV_muNP   4.8    0.   0.
# theory-uncertainty factors (Gaussian priors): B -> Xs gamma (higher orders and m_c interpolation of Misiak et al.
# 2020; the parametric part is sampled), B -> Xs l l, B_q -> mu mu (non-parametric)
ModelParameter  CMFV_r_bsg      1.     0.042  0.
ModelParameter  CMFV_r_bsll     1.     0.075  0.
ModelParameter  CMFV_r_Bmumu    1.     0.015  0.
