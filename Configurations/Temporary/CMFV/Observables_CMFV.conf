# CMFV fit: the rare-decay measurements as MCMC-weighted observables (values as in
# MFVfit data/inputs.yaml).
#   Gaussian:            Observable ... MCMC weight <ave> <err> 0.
#   split Gaussian:      AsyGausObservable ... MCMC weight <ave> <err below> <err above>
#   upper limit at CL:   Gaussian centred at 0 with sigma = limit / Phi^-1(0.5 + CL/2)
# Theory-uncertainty factors: CMFV_r_bsg (4.2%), CMFV_r_bsll (7.5%), CMFV_r_Bmumu (1.5%) multiply the
# predictions ("<factor>*<observable>"); their Gaussian priors are in CMFV.conf.
#
# B -> Xs gamma, E_gamma > 1.6 GeV: HFLAV 2023
BinnedObservable  BR_bsgamma      CMFV_r_bsg*BR_bsgamma       BR_bsgamma  1. -1. MCMC weight 3.49e-4 0.19e-4 0. 1.6 0.
# B -> Xs l l, q^2 in [1, 6] GeV^2: BaBar PRL 112 (2014) 211802, 1.60 +- 0.46 (errors combined), and Belle
# PRD 72 (2005) 092005, 1.49 +- 0.63, combined into their inverse-variance weighted mean: the product of the two
# Gaussians in the same prediction, up to a constant (one evaluation of BR_BXsee instead of two)
BinnedObservable  BR_BXsee_1_6    CMFV_r_bsll*BR_BXsee         BXsee       1. -1. MCMC weight 1.5617485620e-6 0.3715079312e-6 0. 1. 6.
# B_(s,d) -> mu mu: our average of LHCb Run 1-3, CMS 2022, ATLAS 2018 (scripts/combine_bmumu.py)
AsyGausObservable BRbar_Bsmumu_old CMFV_r_Bmumu*BRbar_Bsmumu_old BRbsmm     1. -1. MCMC weight 3.40e-9 0.23e-9 0.25e-9
AsyGausObservable BRbar_Bdmumu_old CMFV_r_Bmumu*BRbar_Bdmumu_old BRbdmm     1. -1. MCMC weight 0.85e-10 0.32e-10 0.34e-10
# K+ -> pi+ nu nu: NA62 2016-2024 (arXiv:2607.16413)
AsyGausObservable BR_Kppnunu      BR_Kppnunu       Kppnunu     1. -1. MCMC weight 9.6e-11 1.8e-11 1.9e-11
# KL -> pi0 nu nu: KOTO < 2.2e-9 at 90% CL (PRL 134 (2025) 081802)
Observable        BR_Kp0nunu      BR_Kp0nunu       Kp0nunu     1. -1. MCMC weight 0. 1.3375050302e-9 0.
# B+ -> K+ nu nu, short distance (NeutrinoTree_flag off): Belle II PRD 109 (2024) 112006
BinnedObservable  BR_BpKpnunu     BR_BpKpnunu      BpKnn       1. -1. MCMC weight 2.3e-5 0.7e-5 0. 0. 22.9021587844
# B0 -> K*0 nu nu: Belle < 1.8e-5 at 90% CL (PRD 96 (2017) 091101)
BinnedObservable  BR_BKstarnunu   BR_BKstarnunu    BKsnn       1. -1. MCMC weight 0. 1.0943222974e-5 0. 0. 19.2176147641
