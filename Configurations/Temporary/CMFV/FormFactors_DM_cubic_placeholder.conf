# Placeholder values for the cubic-order DM form-factor parameters required by HEPfit MPll since ba37010
# (upstream configurations do not define them yet). b_3 = 0 reduces f+ and fT exactly to the quadratic form;
# mBsst0 (B_s* 0+ pole, f0 only) = 5.63 GeV. Replace with the upstream values when available.
ModelParameter  b_3_fplus   0.      0.   0.
ModelParameter  b_3_fT      0.      0.   0.
ModelParameter  b_3_f0      0.      0.   0.
ModelParameter  mBsst0      5.63    0.   0.
